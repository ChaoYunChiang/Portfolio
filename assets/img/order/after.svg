<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" font-family="Noto Sans,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#55588B" stroke-width="1.6"/></marker></defs><text x="12" y="30" font-size="20" font-weight="700" fill="#233876">After: a vendor who wants to register</text><text x="12" y="52" font-size="13" fill="#55588B">Dashed line = hand-off between roles (all through the system in this version)</text><rect x="0" y="70" width="1100" height="120" fill="#F9FAFB" stroke="#BFC2D6"/><rect x="0" y="70" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="130" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">Brand (operations)</text><rect x="0" y="190" width="1100" height="120" fill="#FFFFFF" stroke="#BFC2D6"/><rect x="0" y="190" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="250" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">Platform team</text><rect x="0" y="310" width="1100" height="120" fill="#F9FAFB" stroke="#BFC2D6"/><rect x="0" y="310" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="370" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">Vendor</text><rect x="0" y="430" width="1100" height="120" fill="#FFFFFF" stroke="#BFC2D6"/><rect x="0" y="430" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="490" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">System / Email</text><line x1="304" y1="130" x2="330" y2="130" stroke="#55588B" stroke-width="1.6" marker-end="url(#a)"/><path d="M454 130 H467 V490 H480" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M604 490 H617 V370 H630" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M754 370 H767 V490 H780" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M904 490 H917 V370 H930" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="180" y="98" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="242" y="122" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Create vendor</text><text x="242" y="138" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">(email required)</text><circle cx="182" cy="98" r="11" fill="#2F27CF"/><text x="182" y="98" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">1</text><rect x="330" y="98" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="392" y="130" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Transfer order</text><circle cx="332" cy="98" r="11" fill="#2F27CF"/><text x="332" y="98" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">2</text><rect x="480" y="458" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="542" y="482" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Send transfer email</text><text x="542" y="498" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">(one-time link)</text><circle cx="482" cy="458" r="11" fill="#2F27CF"/><text x="482" y="458" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">3</text><rect x="630" y="338" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="692" y="362" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Open link, register</text><text x="692" y="378" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">and create a team</text><circle cx="632" cy="338" r="11" fill="#2F27CF"/><text x="632" y="338" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">4</text><rect x="780" y="458" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="842" y="482" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Account auto-filled</text><text x="842" y="498" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">on vendor record</text><circle cx="782" cy="458" r="11" fill="#2F27CF"/><text x="782" y="458" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">5</text><rect x="930" y="338" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="992" y="362" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Log in, find order</text><text x="992" y="378" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">ship, add tracking</text><circle cx="932" cy="338" r="11" fill="#2F27CF"/><text x="932" y="338" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">6</text><text x="12" y="580" font-size="14" font-weight="700" fill="#233876">Counted from this diagram</text><text x="12" y="604" font-size="13.5" fill="#26255B">Steps: 6  ·  Hand-offs between roles: 4  ·  Manual hand-offs: 0</text><text x="12" y="626" font-size="11.5" fill="#55588B">The platform team no longer takes part (its lane is left empty to compare with Before).</text><text x="12" y="644.0" font-size="11.5" fill="#55588B">All hand-offs run through the system, so brand and vendor no longer pass messages by hand.</text></svg>