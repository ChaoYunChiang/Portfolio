<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 660" width="1550" font-family="Noto Sans,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#55588B" stroke-width="1.6"/></marker></defs><text x="12" y="30" font-size="20" font-weight="700" fill="#233876">Before: a vendor who wants to register</text><text x="12" y="52" font-size="13" fill="#55588B">Red dot = manual hand-off or back-and-forth contact. Dashed line = hand-off between roles.</text><rect x="0" y="70" width="1550" height="120" fill="#F9FAFB" stroke="#BFC2D6"/><rect x="0" y="70" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="130" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">Brand (operations)</text><rect x="0" y="190" width="1550" height="120" fill="#FFFFFF" stroke="#BFC2D6"/><rect x="0" y="190" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="250" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">ManaOrder team</text><rect x="0" y="310" width="1550" height="120" fill="#F9FAFB" stroke="#BFC2D6"/><rect x="0" y="310" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="370" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">Vendor</text><rect x="0" y="430" width="1550" height="120" fill="#FFFFFF" stroke="#BFC2D6"/><rect x="0" y="430" width="150" height="120" fill="#EDE7FB" stroke="#BFC2D6"/><text x="75" y="490" font-size="14" font-weight="700" fill="#2F27CF" text-anchor="middle" dominant-baseline="middle">System / Email</text><path d="M304 130 H317 V250 H330" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M454 250 H467 V130 H480" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M604 130 H617 V370 H630" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="754" y1="370" x2="780" y2="370" stroke="#55588B" stroke-width="1.6" marker-end="url(#a)"/><path d="M904 370 H917 V130 H930" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="1054" y1="130" x2="1080" y2="130" stroke="#55588B" stroke-width="1.6" marker-end="url(#a)"/><path d="M1204 130 H1217 V490 H1230" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M1354 490 H1367 V370 H1380" fill="none" stroke="#55588B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="180" y="98" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="242" y="122" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Create vendor</text><text x="242" y="138" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">(email required)</text><circle cx="182" cy="98" r="11" fill="#2F27CF"/><text x="182" y="98" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">1</text><rect x="330" y="218" width="124" height="64" rx="8" fill="#fff" stroke="#E5484D" stroke-width="2"/><text x="392" y="242" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Brand asks the team</text><text x="392" y="258" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">for a sign-up URL</text><circle cx="332" cy="218" r="11" fill="#2F27CF"/><text x="332" y="218" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">2</text><circle cx="452" cy="218" r="7" fill="#E5484D"/><rect x="480" y="98" width="124" height="64" rx="8" fill="#fff" stroke="#E5484D" stroke-width="2"/><text x="542" y="122" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Forward the URL</text><text x="542" y="138" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">to the vendor</text><circle cx="482" cy="98" r="11" fill="#2F27CF"/><text x="482" y="98" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">3</text><circle cx="602" cy="98" r="7" fill="#E5484D"/><rect x="630" y="338" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="692" y="362" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Register and</text><text x="692" y="378" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">create a team</text><circle cx="632" cy="338" r="11" fill="#2F27CF"/><text x="632" y="338" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">4</text><rect x="780" y="338" width="124" height="64" rx="8" fill="#fff" stroke="#E5484D" stroke-width="2"/><text x="842" y="354" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Get team account</text><text x="842" y="370" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">(tw- prefix), send</text><text x="842" y="386" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">back by email/LINE</text><circle cx="782" cy="338" r="11" fill="#2F27CF"/><text x="782" y="338" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">5</text><circle cx="902" cy="338" r="7" fill="#E5484D"/><rect x="930" y="98" width="124" height="64" rx="8" fill="#fff" stroke="#E5484D" stroke-width="2"/><text x="992" y="122" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Type the vendor's</text><text x="992" y="138" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">team account in</text><circle cx="932" cy="98" r="11" fill="#2F27CF"/><text x="932" y="98" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">6</text><circle cx="1052" cy="98" r="7" fill="#E5484D"/><rect x="1080" y="98" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="1142" y="130" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Transfer order</text><circle cx="1082" cy="98" r="11" fill="#2F27CF"/><text x="1082" y="98" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">7</text><rect x="1230" y="458" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="1292" y="482" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Send transfer email</text><text x="1292" y="498" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">and system notice</text><circle cx="1232" cy="458" r="11" fill="#2F27CF"/><text x="1232" y="458" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">8</text><rect x="1380" y="338" width="124" height="64" rx="8" fill="#fff" stroke="#2F27CF" stroke-width="1.3"/><text x="1442" y="362" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">Log in, find order</text><text x="1442" y="378" font-size="11.5" fill="#26255B" text-anchor="middle" dominant-baseline="middle">ship, add tracking</text><circle cx="1382" cy="338" r="11" fill="#2F27CF"/><text x="1382" y="338" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="middle">9</text><text x="12" y="580" font-size="14" font-weight="700" fill="#233876">Counted from this diagram</text><text x="12" y="604" font-size="13.5" fill="#26255B">Steps: 9  ·  Hand-offs between roles: 6  ·  Manual hand-offs: 4 (steps 2, 3, 5, 6)</text><text x="12" y="626" font-size="11.5" fill="#55588B">Vendors who do not register skip this path. They have no fixed way to report</text><text x="12" y="644.0" font-size="11.5" fill="#55588B">tracking after shipping, so operations staff follow up by email or LINE.</text></svg>