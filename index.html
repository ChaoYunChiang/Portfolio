<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chao-Yun Chiang | Portfolio</title>
  <style>
    /* 全局樣式重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1117;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 右上角導覽列 (Fixed Header) */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 24px 48px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      z-index: 100;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 32px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #6366f1; /* 經典科技/設計藍紫色 */
    }

    /* 100vh 全版 Hero 遮罩 (Cover Overlay) */
    .hero-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, #1e1e2f 0%, #0f1117 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 50;
      transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
    }

    /* 遮罩滑開時的 Class */
    .hero-overlay.lifted {
      transform: translateY(-100%);
      opacity: 0.9;
    }

    .hero-content h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.2;
    }
    .hero-content p {
      font-size: 1.5rem;
      color: #a0aec0;
      max-width: 600px;
    }

    /* 滑動提示箭頭 */
    .scroll-hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.9rem;
      color: #718096;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .scroll-hint span {
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* 下方 Main Content & Projects 區塊 */
    main {
      margin-top: 100vh;
      min-height: 100vh;
      padding: 100px 10%;
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=2000&q=80') center/cover fixed no-repeat;
      position: relative;
    }

    /* 控制背景圖片暗度 */
    main::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 17, 23, 0.85); 
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
    }

    .section-title {
      font-size: 2.5rem;
      margin-bottom: 48px;
    }

    /* Projects 網格排版 */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
    }

    .project-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .project-card:hover {
      transform: translateY(-8px);
      border-color: #6366f1;
    }

    /* 讓整個卡片的超連結滿版且無底線 */
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card-thumbnail {
      width: 100%;
      height: 200px;
      background-color: #2d3748;
      background-size: cover;
      background-position: center;
    }

    .card-info {
      padding: 24px;
    }
    .card-info h3 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    .card-info p {
      font-size: 0.95rem;
      color: #cbd5e0;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#about">About me</a>

      <a href="#contact">Contact</a>
    </nav>
  </header>

    <div class="hero-content">

      <p>Here’s what I’ve been building.</p>
